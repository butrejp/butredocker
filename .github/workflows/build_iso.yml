name: Build butredocker ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - name: Prepare storage and output directories
        run: |
          sudo mkdir -p /var/lib/containers/storage
          sudo chmod 755 /var/lib/containers/storage
          mkdir -p $GITHUB_WORKSPACE/output

      - name: Initialize loop devices on GitHub runner
        run: |
          sudo modprobe loop
          sudo mknod /dev/loop-control c 10 237 || true
          for i in {0..7}; do
            sudo mknod /dev/loop$i b 7 $i || true
          done
          sudo losetup -f

      - name: Configure cosign signature verification
        run: |
          sudo mkdir -p /etc/containers/registries.d
          sudo mkdir -p /etc/pki/containers

          sudo tee /etc/containers/policy.json > /dev/null << 'POLICY'
          {
            "default": [{"type": "insecureAcceptAnything"}],
            "transports": {
              "docker": {
                "ghcr.io/butrejp": [
                  {
                    "type": "sigstoreSigned",
                    "keyPath": "/etc/pki/containers/cosign.pub",
                    "signedIdentity": {"type": "matchRepository"}
                  }
                ]
              }
            }
          }
          POLICY

          sudo tee /etc/containers/registries.d/butredocker.yaml > /dev/null << 'REGISTRY'
          docker:
            ghcr.io/butrejp:
              use-sigstore-attachments: true
          REGISTRY

          sudo cp $GITHUB_WORKSPACE/cosign.pub /etc/pki/containers/cosign.pub

      - name: Pull and verify butredocker image
        run: |
          sudo podman pull ghcr.io/butrejp/butredocker:latest

      - name: Write bootc-image-builder config
        run: |
          cat << 'EOF' > $GITHUB_WORKSPACE/config.toml
          [customizations.installer.kickstart]
          contents = """
          %post --erroronfail
          if command -v grubby > /dev/null; then
              grubby --update-kernel=ALL --remove-args="crashkernel" || true
          fi
          sed -i 's/crashkernel=[^ ]*//g' /etc/default/grub || true
          groupadd -f plugdev
          systemctl disable systemd-oomd.service
          %end
          """
          EOF

      - name: Generate Custom Installer ISO
        run: |
          sudo podman run --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $GITHUB_WORKSPACE/config.toml:/config.toml:ro \
            -v $GITHUB_WORKSPACE/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            --local \
            ghcr.io/butrejp/butredocker:latest

      - name: Fix output permissions and rename ISO
        run: |
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/output
          mkdir -p $GITHUB_WORKSPACE/results
          find $GITHUB_WORKSPACE/output -name '*.iso' -exec cp {} \
            "$GITHUB_WORKSPACE/results/butredocker-${{ env.BUILD_DATE }}.iso" \;

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butredocker-${{ env.BUILD_DATE }}
          path: ./results/butredocker-${{ env.BUILD_DATE }}.iso
          retention-days: 14
          if-no-files-found: error
